<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-label="The Your Chance Fund">
  <defs>
    <style>
      .navy { fill: #14315B; }
      .green { fill: #4A9A3F; }
      .gold { fill: #D8A22E; }
      .t-small { font: 700 20px 'Arial', sans-serif; letter-spacing: 6px; }
      .t-main  { font: 800 44px 'Arial', sans-serif; }
      .t-fund  { font: 700 22px 'Arial', sans-serif; letter-spacing: 14px; }
    </style>
  </defs>

  <!-- Swoosh arc -->
  <path d="M60 44 Q200 2 340 40" fill="none" stroke="#14315B" stroke-width="9" stroke-linecap="round"/>
  <!-- Gold star riding the arc -->
  <path class="gold" d="M267 12 l6.5 13.2 14.6 2.1 -10.6 10.3 2.5 14.5 -13-6.8 -13 6.8 2.5-14.5 -10.6-10.3 14.6-2.1z"/>

  <!-- THE -->
  <text class="navy t-small" x="34" y="78">THE</text>

  <!-- YOUR CHANCE — textLength pins the width so the final E can never clip -->
  <text class="t-main" x="30" y="112" textLength="352" lengthAdjust="spacingAndGlyphs"><tspan class="navy">YOUR</tspan><tspan class="green" dx="14">CHANCE</tspan></text>

  <!-- FUND with flanking rules -->
  <line x1="40" y1="134" x2="128" y2="134" stroke="#14315B" stroke-width="3"/>
  <text class="navy t-fund" x="140" y="141">FUND</text>
  <line x1="270" y1="134" x2="360" y2="134" stroke="#14315B" stroke-width="3"/>
</svg>
